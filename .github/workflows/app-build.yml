name: App deb

# Build the dev.aayy.ipadecrypt rootless app .deb (the GUI + helper + daemon,
# with the patched ipatool SAP emulator statically linked). On a v* tag: release
# it and tell the APT repo to publish. The repo's go.mod has
# `replace github.com/majd/ipatool/v2 => ../ipatool-fork`, so CI checks the fork
# out alongside.
on:
  push:
    branches: [aayy/work]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  THEOS_COMMIT: 67db2ab8d950910161730de77c322658ea3e6b44
  SDK_ZIP: https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.3.1-SDKs/iPhoneOS17.3.1.sdk.zip
  SDK_SHA256: 5db95a1a0492a6436d2cd40a0f66cf63f06b6d0a70c9a617ace25feb0dce222d

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: ipadecrypt

      - name: Check out ipatool fork (go.mod replace target)
        uses: actions/checkout@v4
        with:
          repository: aayy-dev/ipatool
          ref: keychain-passphrase-optional
          path: ipatool-fork

      - uses: actions/setup-go@v5
        with:
          go-version-file: ipadecrypt/go.mod

      - name: Install tools
        run: brew install ldid dpkg make cmake

      - name: Install Theos
        run: |
          THEOS="$RUNNER_TEMP/theos"
          git clone --quiet https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --quiet "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive --quiet
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.zip" "$SDK_ZIP"
          echo "$SDK_SHA256  $RUNNER_TEMP/sdk.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdk"
          mkdir -p "$THEOS/sdks"
          mv "$RUNNER_TEMP/sdk/iPhoneOS17.3.1.sdk" "$THEOS/sdks/"

      - name: Build app deb
        working-directory: ipadecrypt/app
        run: INSTALL=0 GO="$(command -v go)" ./build.sh

      - name: Locate deb
        id: deb
        run: |
          deb=$(ls -t ipadecrypt/app/packages/dev.aayy.ipadecrypt_*.deb | head -1)
          echo "path=$deb" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$deb")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.deb.outputs.name }}
          path: ${{ steps.deb.outputs.path }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.deb.outputs.path }}" \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" "${{ steps.deb.outputs.path }}" --clobber

      - name: Publish to APT repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.IOS_REPO_TOKEN }}
        run: |
          gh api repos/aayy-dev/aayy-dev.github.io/dispatches \
            -f event_type=publish-deb \
            -F "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -F "client_payload[tag]=${GITHUB_REF_NAME}"
